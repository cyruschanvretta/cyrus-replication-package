      EQAO Opinion Essay Topic Development scorer training (wi-1129-sp8-TD.md; “LW: Warm Place
      (TD)”, sp8-TD, window 1129). Calibrate with the rubric slides, annotated Anchors by code, and
      unannotated Training Responses in that deck.
    references: >-
      Printed PDF page numbers in the extracted guide (EQAO footer):

      session outline + opinion prompt (≈pp. 2–6); TD rubric / code descriptors (≈pp. 7–8);
      “Anchors” intro (p. 9) and “Arguing Both Sides” (p. 10); annotated exemplars by code (e.g.
      Code 10: three anchors on pp. 13–16); unannotated “Training Responses” with scored follow-on
