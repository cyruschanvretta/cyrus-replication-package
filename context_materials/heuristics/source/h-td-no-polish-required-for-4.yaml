id: h-td-no-polish-required-for-4
description: >
  When scoring **TD** only: **thorough (4)** does **not** require rhetorical polish, “voice,”
  counter-arguments, or integrative brilliance — only **sustained, specific, well-elaborated support
  tied to the prompt** per the rubric.
grounded_in: |
  Stops under-calls at 3 for plain but well-supported multi-part responses.
consumes:
  - td-depth-vs-surface
  - td-overall-synthesis-strength
  - td-reasoning-density
decision: |
  TD: If reasoning_density is adequate-or-better and depth_vs_surface is not “purely surface,”
  do not withhold 4 for lack of “sophistication,” “nuance,” or “literary style.” Reserve 3 when
  support is patchy, generic across moves, or missing concrete tie to the prompt — not when the
  essay is simple but repeatedly example-backed.
sme_traceability:
  rubric:
    high_level: >-
      Anchored to the Topic Development (WR-EXT / OSSLT) scale—opinion, specificity of support, and
      organization.
    references: >-
      data-container/prod/extracted/item-type-rubrics/generated/derived-text/rubric-b29afc2906ecf0b9.md

      Platform verbatim descriptors for codes 10–60.
    link: direct
    rubric_excerpts:
      - code: "40"
        text: >-
          The essay is related to the prompt. A clear and consistent opinion is developed with
          sufficient

          supporting details; however, only some are specific. The content organization is
          mechanical, and

          any lapses do not distract from the overall communication.
        highlights: []
      - code: "50"
        text: >-
          The essay is related to the prompt. A clear and consistent opinion is developed with
          sufficient

          specific supporting details. The content organization is logical.
        highlights: []
  training_material:
