id: h-td-ignore-mechanics-for-5-6
description: >-
  The model is currently penalizing Band 5 and 6 responses for using 'mechanical' transitions (e.g.,
  'Firstly', 'Secondly', 'To begin with'). In the 5/6 bands, the distinction is the specificity and
  thoughtfulness of the details, not the sophistication of the transitions. The model must ignore
  transition style if the 'consequence-based reasoning' is present.
grounded_in: >-
  Grounded in taqr_ids: 437118961, 428613492, 160800944

  For 437118961, the model capped at 5 because of predictable structure; for 428613492, it capped at
  5 because of mechanical transitions despite high specificity.
consumes:
  - td-consequence-linkage-density
  - td-technical-specificity-index
decision: >-
  When evaluating the transition from Band 4 to Band 5 or 6, you MUST explicitly ignore the presence
  of mechanical or predictable transitions (e.g., 'Firstly', 'Secondly', 'In addition', 'To begin
  with'). 


  Instead, focus your assessment entirely on the 'Consequence Audit'. Check if the concrete nouns
  identified in `td-detail-unpack-depth` are paired with 'analytic glue' (consequences, impacts, or
  why/how). 


  If the student provides highly specific, non-generic details (e.g., 'S.A.D.', 'Vitamin D', 'supply
  chain issues') and connects them to an impact, they are eligible for Band 5 or 6, even if the
  organization is 'mechanical' or 'predictable'. 


  DO NOT withhold a 5 or 6 score simply because the student uses a standard school-essay structure.
  The distinction is the 'thoughtfulness' of the content, not the 'sophistication' of the prose.
boundary: 4 vs 5/6
risk: Could over-score very thin 3s that use 'First, Second' with high-level nouns.
