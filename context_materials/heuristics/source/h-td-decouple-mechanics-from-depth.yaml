id: h-td-decouple-mechanics-from-depth
description: >-
  Corrects the error where the model penalizes 'mechanical' transitions (First, Secondly, In
  conclusion) when the underlying development (consequence-based reasoning) is actually
  high-quality. The model currently treats 'mechanical' as a synonym for 'lacks depth'.
grounded_in: >-
  Grounded in taqr_ids: 280316917, 428613492, 160800944

  280316917: Model penalized 'mechanical' transitions despite presence of 'analytic glue';
  428613492: Model capped at 4 due to 'mechanical' structure despite high specificity.
consumes:
  - td-detail-unpack-depth
  - td-consequence-linkage-density
  - td-laundry-list-detection
decision: >-
  When evaluating the transition from Band 4 to Band 5, you must explicitly ignore the presence of
  mechanical transitions (e.g., 'Firstly', 'Secondly', 'In addition'). 


  Instead, perform a 'Consequence Audit'. Check if the student provides 'analytic
  glue'—specifically, if a concrete noun or example is paired with a 'consequence' or 'impact'
  (e.g., 'snow leads to accidents' or 'warmth leads to lower costs'). 


  If `td-consequence-linkage-density` is high and `td-detail-unpack-depth` shows expansion, the
  response is eligible for 5, even if the organization is 'mechanical'. 


  DO NOT assign a 5 if the response is merely a list of nouns (a 'laundry list') without these
  links. The distinction is the presence of the link, not the sophistication of the transition.
boundary: 4 vs 5
risk: Could over-score purely enumerative lists that lack any consequence-based reasoning.
