id: h-boundary-3-vs-4
description: >
  Score 3 = adequate analysis; some specificity but gaps, thin moves, or critique-by-enumeration
  without development. Score 4 = sustained analysis where moves are developed (not just listed), OR
  strong literary pattern: claim + organized stages + explicit symbol tied to choices.
grounded_in: >
  Training: 50004 (score 4) offers claim, counterpoints, qualification, and trade-offs.

  50006 (score 4) traces form → meaning → speaker's ambivalence with precise commentary.

  50002 (score 4): expert — 'clear claim, organized stages, explicit symbol tied to choices'
  (structural specificity counts; quotes not required).

  50008 (score 3): expert — 'Adequate critique of gaps; could extend evaluation of sources.' Lists
  concrete omissions without developing each line.
consumes:
  - td-staged-reasoning
  - td-claim-evidence-wiring
  - td-specificity
decision: >
  LITERARY: If clear claim + organized stages + explicit symbol/motif tied to choices → 4 on TD (do
  not require direct quotes).

  PERSUASIVE/OPINION (non-critique): If several distinct reasons each have an elaborated sentence or
  concrete example, prefer 4 over 3. Do not cap at 3 solely because intro/conclusion summarize the
  body or the essay “lists” reasons when each reason is actually developed.

  PERSUASIVE/CRITIQUE: If the student enumerates gaps or improvements but does not develop each with
  sustained reasoning → cap at 3.

  OTHERWISE: If 3+ moves AND each move is developed with explanation or linkage → 4. If moves are
  only named or listed → 3.
