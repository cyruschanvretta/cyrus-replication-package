id: h-td-prevent-mechanical-penalty-for-6
description: >-
  Corrects the error where the model denies Band 6 scores because transitions are 'mechanical'
  (First, Second, Third). In Band 6, the distinction is the 'thoughtful choice' of details and
  'coherence' of progression, not the sophistication of the transition words. If technical
  specificity (named entities) and consequence density are high, ignore mechanical markers.
grounded_in: >-
  Grounded in taqr_ids: 164589894, 437118961, 428613492

  For 164589894, the model ignored high-level specificity (Harvard/MIT) due to 'mechanical'
  structure; for 437118961, it failed to reward effective topic sentences.
consumes:
  - td-technical-specificity-index
  - td-consequence-density
  - td-structural-completeness
decision: >-
  When evaluating for Band 6 (code 60), you must explicitly ignore the presence of 'mechanical' or
  'predictable' transitions (e.g., 'Firstly', 'In addition', 'To begin with'). 


  Instead, perform a 'Specificity and Choice Audit'. Check if the student uses 'high-level' or
  'non-generic' nouns (e.g., 'Harvard', 'S.A.D.', 'mitochondria', 'London, Ontario') as identified
  in td-technical-specificity-index. 


  If the student provides specific, non-obvious details and links them to consequences
  (td-consequence-density), and these details feel 'thoughtfully chosen' rather than just 'present',
  assign a 6. 


  Do NOT assign a 6 if the response is merely a list of names without any 'analytic glue' or
  'consequence' (e.g., 'I like apples, oranges, and bananas because they are fruit' is NOT a 6). 


  Use the presence of 'technical specificity' as your primary signal for 6, and use 'mechanical
  transitions' only as a neutral factor, not a negative one.
boundary: 5 vs 6
risk: Could over-score 5s that are just lists of names without any logical connection.
sme_traceability:
