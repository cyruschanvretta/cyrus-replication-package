id: h-boundary-1-vs-2
description: >
  Score 1 = restates plot, labels, or gives generic theme without textual specificity. Score 2 =
  limited but real engagement—surface graph description, or thin but concrete observation.
grounded_in: >
  50007 (score 1): plot restatement + generic 'teamwork' — expert: does not substantiate main idea
  with textual specifics.

  50005 (score 1): repeats 'confusing' without technique.

  50009 (score 2): surface graph trend only — expert: surface reading; still limited development
  (not 1).

  50001 (score 2): names repetition + mood + theme with some textual anchoring.
consumes:
  - td-claim-evidence-wiring
  - td-depth-vs-surface
decision: |
  If ONLY plot summary OR generic theme name without concrete textual detail → 1.
  If describing graph trend/shape without passage link → 2 (not 1).
  If at least one concrete observation tying specific source detail to meaning → 2 or higher.
  TD (opinion / OSSLT-style): If the entire response is **one sentence** (or
  two minimal sentences) with **parallel assertions** only (e.g. two reasons in
  one breath) and **zero** elaboration, examples, or consequence — cap at
  **1** (code 10), not 2. A clear opinion without any development stays in the
  lowest band.
sme_traceability:
  rubric:
    high_level: >-
      Anchored to the Topic Development (WR-EXT / OSSLT) scale—opinion, specificity of support, and
      organization.
    references: >-
      data-container/prod/extracted/item-type-rubrics/generated/derived-text/rubric-b29afc2906ecf0b9.md

      Platform verbatim descriptors for codes 10–60.
    link: direct
    rubric_excerpts:
      - code: "10"
        text: >-
          The essay is related to the prompt but does not express an opinion.

          or

          The essay expresses an opinion with ideas but no supporting details, or it provides
          details

          unrelated to the opinion. There is no evidence of content organization.
        highlights: []
      - code: "20"
        text: >-
          The essay is related to the prompt, but only part of the response expresses and supports
          an

          opinion.

          or

          The essay is related to the prompt and expresses and supports an opinion, but the opinion
          is

          unclear or inconsistent. The connection between the ideas and details and the opinion is
          not always

          evident. There are insufficient supporting details: too few or repetitious. There is
          limited evidence

          of content organization.
        highlights: []
  training_material:
    high_level: >-
      EQAO Opinion Essay Topic Development scorer training (wi-1129-sp8-TD.md; “LW: Warm Place
      (TD)”, sp8-TD, window 1129). Calibrate with the rubric slides, annotated Anchors by code, and
      unannotated Training Responses in that deck.
    references: >-
      Printed PDF page numbers in the extracted guide (EQAO footer):

      session outline + opinion prompt (≈pp. 2–6); TD rubric / code descriptors (≈pp. 7–8);
      “Anchors” intro (p. 9) and “Arguing Both Sides” (p. 10); annotated exemplars by code (e.g.
      Code 10: three anchors on pp. 13–16); unannotated “Training Responses” with scored follow-on
      pages (from ≈p. 36).


      data-container/prod/extracted/training-materials/

      Primary guide: data-container/prod/extracted/training-materials/guides/wi-1129-sp8-TD.md

      Additional windows (same item type):
      data-container/prod/extracted/training-materials/guides/wi-1131-sp8-TD.md,
      data-container/prod/extracted/training-materials/guides/wi-1133-sp8-TD.md,
      data-container/prod/extracted/training-materials/guides/wi-1135-sp8-TD.md, …
    link: indirect
  exemplar_selection:
    high_level: >-
      No rationales auto-resolved from ids in grounded_in; exemplar backtrace is the generic pool
      location until cases are linked.
    references: |-
      data-container/prod/extracted/rationales/osslt/td/<band>/t<taqr_id>.md (tpcl/ mirrors).
      Cross-check taqr_id from platform exports; older ids in grounded_in may not resolve here.
