        text: >-
          The essay is related to the prompt. A clear and consistent opinion is developed with
          sufficient

          supporting details; however, only some are specific. The content organization is
          mechanical, and

          any lapses do not distract from the overall communication.
        highlights: []
      - code: "50"
        text: >-
          The essay is related to the prompt. A clear and consistent opinion is developed with
          sufficient

