id: h-td-consequence-audit-for-5
description: >-
  Corrects the under-scoring of Band 5/6. The model currently caps scores at 4 when it sees
  'mechanical' transitions, even if the 'consequence' or 'impact' of the details is high-quality. It
  must look for the 'why' or 'so what' attached to nouns.
grounded_in: >-
  Grounded in taqr_ids: 430219169, 437118961, 160800944

  430219169: Model ignored the causal link between pollution and eye damage; 437118961: Model
  ignored the effective engagement of the intro; 160800944: Model failed to recognize the 'analytic
  glue' of Vitamin D/anxiety.
consumes:
  - td-consequence-density
  - td-detail-unpack-depth
  - td-technical-specificity-index
decision: >-
  Before assigning a 4, perform a 'Consequence Audit'. 


  Identify every concrete noun or example using `td-detail-unpack-depth`. For each, check if there
  is an associated 'impact' or 'consequence' (e.g., 'leads to', 'results in', 'causes', 'so that'). 


  If the student provides 'consequence-based' reasoning for at least two distinct axes (e.g., 'X
  happens, which leads to Y'), and these details are specific (using
  `td-technical-specificity-index`), you MUST consider a 5. 


  Do NOT let 'mechanical transitions' (First, Second, Third) prevent a 5 if the 'consequence' is
  present. 


  Example: If a student says 'Warm weather allows for BBQs and water parks,' that is a 4. If they
  say 'Warm weather allows for BBQs, which saves money on heating costs,' that is a 5. 


  Guardrail: If the 'consequence' is merely a tautology (e.g., 'it is fun because it is enjoyable'),
  do NOT upgrade to 5.
boundary: 4 vs 5
risk: Could over-score 4s that have one good link but are otherwise just lists.
