id: h-cv-thorough-when-clean
description: >
  When scoring **CV** only: strong control (syntax + mechanics) with errors that do not block
  understanding → top band when the response has sufficient length to show control.
grounded_in: |
  CV-4: errors do not impede meaning.
consumes:
  - cv-error-band
  - cv-sentence-variety
  - cv-meaning-flow
decision: |
  CV: If error_band is light AND sentence_variety is mostly controlled AND meaning_flow is clear,
  prefer 4 over 3 unless the response is too short to demonstrate conventions at all.
sme_traceability:
