id: h-cv-prefer-4-when-meaning-clear
description: >
  When scoring **CV** only: if the reader understands the student **without re-reading** and errors
  are **occasional / local** (not every sentence), **thorough (4)** is appropriate — experts often
  reserve 3 for “good but flawed”; use 4 when control is clearly strong.
grounded_in: |
  Closes AI=3 vs expert=4 gaps on conventions when ideas are plain but mechanics are fine.
consumes:
  - cv-meaning-flow
  - cv-error-band
  - cv-sentence-variety
decision: >
  CV: If meaning_flow is “clear throughout” or “clear with rare friction,” and error_band is not
  heavy,

  prefer 4 over 3. Reserve 3 for noticeable error density or sentence control issues that slow
  reading.
