id: h-cv-thorough-not-4-when-heavy-errors
description: >
  When scoring **CV** only: **thorough (4)** requires errors **not** to impede meaning — if the
  error rate is **high** (many sentences affected) or patterns break control, do **not** award 4
  even when the reader can eventually recover meaning.
grounded_in: |
  Separates “clear enough after effort” from true thorough control; targets AI=4 / expert=3.
consumes:
  - cv-error-band
  - cv-sentence-variety
  - cv-meaning-flow
decision: >
  CV: If error_band is “heavy” OR sentence_variety is frequently broken, cap at 3 even when

  meaning_flow is not “opaque.” Thorough means sustained control, not “understandable despite

  noise.” If only occasional slips and meaning_flow is clear throughout, this heuristic does not
  apply.
