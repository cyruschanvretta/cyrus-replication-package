id: h-td-prevent-laundry-list-overscore
description: >-
  Corrects the error where the model assigns a 4 or 3 to responses that are merely lists of nouns or
  examples without explanation. It forces the model to check for 'analytic glue' (consequence, why,
  or how) for each item in a list.
grounded_in: >-
  Grounded in taqr_ids: 429096017, 430254766

  For 429096017, the model rewarded the mention of 'military officer' without checking if the point
  was actually developed; for 430254766, it treated a list of nouns as 'opinion support' despite
  zero elaboration.
consumes:
  - td-detail-unpack-depth
  - td-reasoning-density
decision: >-
  Before assigning a score of 3 or 4, you must perform a 'Linkage Audit' on all concrete nouns or
  examples identified via 'td-detail-unpack-depth'. 


  For every specific example (e.g., 'hockey captain', 'factories', 'schools'), check if there is a
  corresponding 'analytic move' (an explanation of why this matters, a consequence, or a causal
  link). If a response contains multiple specific nouns but lacks 'analytic glue' (the 'how' or
  'why'), you must cap the score at 2. 


  Specifically, for the 3 vs 4 boundary: A score of 4 requires that the supporting details are
  'sufficient'. If the details are merely 'present' but 'unelaborated' (i.e., they are just labels),
  the score must be 3. 


  Example of 2: 'I like cities because of schools, parks, and museums.' (List of nouns, no 'why'). 

  Example of 3: 'I like cities because they have schools which provide education.' (Noun + simple
  consequence).

  Example of 4: 'I like cities because the density of schools allows for specialized programs like
  coding, which prepares students for the future.' (Noun + specific elaboration).


  Do not allow a 'laundry list' of examples to lift a score to 4.
boundary: 2 vs 3 vs 4
risk: Could under-score very brief but valid 3s that use simple nouns.
