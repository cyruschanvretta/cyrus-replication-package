id: h-cv-first-draft-calibration
description: >
  When scoring **CV** only: calibrate to **first-draft** conditions — students did not have the regular review
  process (feedback, peer editors, etc.). Do not expect publication polish; isolated slips compatible with strong bands
  when meaning and control are evident.
grounded_in: |
  EQAO CV training: first-draft reminder (wi-1130-sp9-CV and sibling guides).
consumes:
  - cv-meaning-flow
  - cv-error-band
  - cv-mechanics
decision: |
  CV: If `meaning_flow` is clear and errors are local, do **not** treat the response as if it had been edited to a final
  draft. Prefer the **higher** defensible band on true borderlines when the only issue is minor mechanics that do not
  derail reading.

  Do not use “would need editing” as a reason to cap at 3 when distract-level interference is not present.
boundary: 3 vs 4 (also informs 2 vs 3 at the margin)
risk: May over-score messy but understandable first drafts if applied without checking distract vs do-not-distract.
