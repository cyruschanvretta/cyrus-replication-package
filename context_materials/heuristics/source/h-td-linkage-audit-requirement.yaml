id: h-td-linkage-audit-requirement
description: >-
  Corrects the error where the model awards Band 3 or 4 simply because specific nouns (e.g.,
  'hockey', 'schools') are present. The model must verify that these nouns are connected to a 'why'
  or 'how' (analytic glue). If the nouns are merely listed without a consequence or mechanism, the
  score must be capped at 2.
grounded_in: >-
  Grounded in taqr_ids: 430254766, 266778344, 443269976

  430254766: Model saw nouns (schools, factories) and gave 2, but expert gave 1 because no 'why'
  existed; 266778344: Model saw 'new places' and gave 2, expert gave 1; 443269976: Model saw 'power
  bills' and gave 3, expert gave 2 because it was just a list of symptoms.
consumes:
  - td-detail-unpack-depth
  - td-analytic-link-present
decision: >-
  Before assigning a score of 3 or higher, perform a 'Linkage Audit' on every concrete noun or
  example identified via 'td-detail-unpack-depth'. 


  For every identified noun (e.g., 'snowmobiling', 'taxes', 'schools'), you MUST find a
  corresponding 'analytic move' in the text. An analytic move is a phrase that explains the
  consequence, cause, or importance of that noun (e.g., '...which leads to...', '...because...',
  '...resulting in...').


  If the response contains multiple specific nouns but lacks these 'analytic links' (e.g., it is
  just a list: 'I like beaches, sun, and water'), you MUST cap the score at 2. Do NOT allow a
  'laundry list' of labels to reach Band 3. 


  Example of what to REJECT for Band 3: 'I like warm weather because it is nice and there are many
  places to go like beaches and parks.' (The 'because' is tautological/circular). 

  Example of what to ACCEPT for Band 3: 'Warm weather allows for more activities like swimming,
  which keeps people active.' (The link 'allows for... which keeps...' is a valid analytic move).
boundary: 2 vs 3
risk: Could under-score legitimate Band 3 responses that have very brief but valid links.
