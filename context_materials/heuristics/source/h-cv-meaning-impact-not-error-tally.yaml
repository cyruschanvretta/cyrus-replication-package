id: h-cv-meaning-impact-not-error-tally
description: >
  When scoring **CV** only: **consider the impact of conventions on communication of meaning** — scoring is **not** a
  “hunt for the error” or “counting errors” exercise. Do not lower the band solely because a tally of issues is high if
  reading remains smooth and meaning is intact.
grounded_in: |
  EQAO CV training p.5 callout (control-of-conventions slide).
consumes:
  - cv-meaning-flow
  - cv-error-band
  - cv-rhythm-disruption
decision: |
  CV: Weight **reading experience** and **meaning** over raw error counts.

  If `meaning_flow` is clear and `cv-rhythm-disruption` is low, **do not** assign 2–3 just because multiple minor issues
  exist (e.g., several typos or a few slips) — unless they **distract** or **interfere** as in the rubric.

  Reserve down-scoring for patterns that force re-reading, interrupt rhythm, or obscure intent — aligned with training
  sentence-structure guidance and interfere/distract descriptors.
boundary: 2 vs 3 and 3 vs 4
risk: Could under-penalize dense but locally “fixable” error fields if rhythm is misjudged as smooth.
