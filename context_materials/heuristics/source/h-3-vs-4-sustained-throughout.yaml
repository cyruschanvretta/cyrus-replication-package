id: h-3-vs-4-sustained-throughout
description: >
  Prefer 4 over 3 when multiple points are not only present but developed with sustained attention —
  revisited details, weighing, or an integrative sentence — across most of the response.
grounded_in: >
  WR-EXT-12 TD descriptor_4 (sustained, specific, well-elaborated support) from extracted item-type
  rubric JSON; heuristic decision logic is not copied from platform PDFs.
consumes:
  - td-overall-synthesis-strength
  - td-elaboration-per-move
  - td-staged-reasoning
decision: |
  If elaboration_per_move shows sustained on two or more moves OR synthesis is
  moderate-or-strong with multiple axes from td-multi-axis-argument, consider 4.
  Reserve 3 for competent but patchy development or synthesis that drops mid-response.
