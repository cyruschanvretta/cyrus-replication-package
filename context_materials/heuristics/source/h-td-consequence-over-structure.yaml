id: h-td-consequence-over-structure
description: >-
  Corrects the error where the model caps scores at 3 or 4 because the organization is 'mechanical'
  or 'enumerative' despite the presence of strong consequence-based reasoning. The model must
  prioritize the presence of 'analytic glue' (consequence/impact) over the 'sophisticity' of
  transitions.
grounded_in: >-
  Grounded in taqr_ids: 170184440, 437118961, 160800944, 160967597

  taqr 170184440: Model ignored consequence-linked nouns in favor of mechanical structure; taqr
  437118961: Model ignored thoughtful detail due to standard transitions; taqr 160800944: Model
  capped 6 because of 'First/Second/Third' structure.
consumes:
  - td-consequence-density
  - td-detail-unpack-depth
  - td-laundry-list-detection
decision: >-
  When evaluating the transition from Band 4 to 5, or 5 to 6, you must explicitly ignore the
  'mechanical' nature of transitions (e.g., 'Firstly', 'Secondly', 'In addition').


  Instead, perform a 'Consequence Audit' using 'td-consequence-density'. If the student provides
  specific nouns (e.g., 'soccer pitch', 'eczema', 'tax') and links them to a clear impact or
  mechanism (e.g., 'leads to sickness', 'causes anxiety', 'results in savings'), this satisfies the
  requirement for 'sufficiently specific' (4) or 'consistently specific' (5) details.


  Do NOT award a 5 or 6 if the response is merely a list of nouns without any 'how' or 'why'.
  However, if the 'how' is present but the 'structure' is simple, you MUST allow the higher score. 


  Example: A response saying 'First, snow causes accidents because roads are slippery' is a 5-level
  move. A response saying 'First, snow. Second, ice. Third, cold.' is a 2-level move.
boundary: 4 vs 5 and 5 vs 6
risk: Could lead to over-scoring 'laundry lists' if they happen to include one consequence.
