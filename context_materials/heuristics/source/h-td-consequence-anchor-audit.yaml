id: h-td-consequence-anchor-audit
description: >-
  Corrects over-scoring in the 1-2 and 2-3 range. The model currently sees lists of nouns (e.g.,
  'schools, factories, gyms') and assigns Band 2. An expert assigns Band 1 if these nouns are merely
  listed without any 'analytic glue' (verbs of consequence or impact).
grounded_in: >-
  Grounded in taqr_ids: 430254766, 266778344

  430254766: Model saw nouns as development; 266778344: Model saw 'new things, new places' as Band 2
  development.
consumes:
  - td-laundry-list-detection
  - td-noun-list-audit
  - feature-analytic-glue-density
decision: >-
  Before assigning a score of 2, you must perform a 'Linkage Audit' on all identified nouns in
  `td-laundry-list-detection`. 


  If the student provides a list of nouns (e.g., 'schools, factories, markets') but there are NO
  verbs of consequence (e.g., 'leads to', 'causes', 'results in') or explanatory phrases (e.g.,
  'because', 'so that') connecting these nouns to an opinion, you MUST assign a score of 1. 


  A score of 2 requires at least one instance of 'analytic glue' where a noun is explicitly tied to
  an impact. If the response is merely a collection of labels, it is Band 1. Do not allow a list of
  nouns to substitute for development.
boundary: 1 vs 2
risk: Could under-score Band 2 responses that have very thin but present links.
