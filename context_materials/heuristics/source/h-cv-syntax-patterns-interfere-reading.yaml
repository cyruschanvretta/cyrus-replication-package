id: h-cv-syntax-patterns-interfere-reading
description: >
  When scoring **CV** only: treat **run-on sentences**, **comma splices**, and **fragments** (training p.7) as the
  primary **sentence-structure** patterns that interfere with or distract from communication when they are frequent or
  severe — not merely cosmetic. Pair with p.6: structure errors force re-reading and inference of meaning.
grounded_in: |
  EQAO CV training pp.6–7 (sentence structure / common errors with incorrect examples).
consumes:
  - cv-rhythm-disruption
  - cv-boundary-collapse
  - cv-meaning-flow
decision: |
  CV: If the response shows **frequent** run-ons, comma splices, or fragments (as in the training exemplars), treat that
  as **rhythm and boundary** failure — not as “ideas are understandable therefore Adequate.”

  When `cv-boundary-collapse` or `cv-rhythm-disruption` is high, **cap** at **Limited (2)** or hold at **Adequate (3)**
  only if errors are genuinely occasional and reading is smooth — not when every paragraph shows structural breakdown.

  Meaning clarity **does not** override missing sentence boundaries or chronic splices; align with **distract** vs **do
  not distract** wording in the rubric.
boundary: 2 vs 3 (and 1 vs 2 when collapse is extreme)
risk: May over-penalize bilingual or developmental patterns if “fragment” is mis-detected.
