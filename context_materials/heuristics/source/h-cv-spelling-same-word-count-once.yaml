id: h-cv-spelling-same-word-count-once
description: >
  When scoring **CV** only: **count the same word misspelled more than once as one error** (training spelling slide).
  Do not treat five instances of the same lexical misspelling as five independent reasons to drop a band.
grounded_in: |
  EQAO CV training p.8 — “When assigning a rubric code, remember to:” spelling bullets.
consumes:
  - cv-error-band
  - cv-mechanics
  - cv-meaning-flow
  - cv-rhythm-disruption
decision: |
  CV: When reasoning about spelling severity, **collapse** repeated misspellings of the **same word** into a **single**
  spelling issue for judgment purposes.

  That single issue still counts toward conventions, but it must not multiply into an artificial “systemic spelling
  breakdown” unless different words / patterns are also wrong or reading is actually impaired.

  Use `cv-meaning-flow` and `cv-rhythm-disruption` (if available in the slice) to confirm whether spelling actually
  distracts; repeated *same* error without reading impact should not cap thorough by itself.
boundary: 3 vs 4 (also 2 vs 3 when spelling recurrence inflates perceived severity)
risk: May under-weight responses that misspell many *different* high-frequency words — still evaluate overall control.
