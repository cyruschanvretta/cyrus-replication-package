id: h-td-named-without-unpacking-floor-2
description: >
  When development is mostly “named without unpacking” (laundry list of sensations, activities, or
  contrast labels), default to code 20 (limited), not 30 — unless at least one main move has an
  analytic consequence (why/how/impact). Bridges the gap where the model diagnoses thin detail but
  still parks at 3.
grounded_in: >
  Run 058: taqr 163297151, 434773702 (AI=3, expert=2). Model text described “named without
  unpacking” / “insufficient and vague” yet scored 30. Aligns with rubric limited (20) vs competent
  (30) when support is opinion + list.
consumes:
  - td-detail-unpack-depth
  - td-elaboration-per-move
  - td-multi-axis-argument
decision: |
  TD (2 vs 3): After holistic read, cross-check td-detail-unpack-depth /
  elaboration-per-move. If **most** moves are **named-only** (concrete nouns or
  parallel claims **without** a sentence of why/how/consequence per move), the
  default is **2** (code 20), **not 3** — unless there is **at least one**
  distinct reason with a **clear analytic consequence** (not just another
  label). Opinion + list of sensations without unpacking is **limited**, not
  “competent with vague details.”
  Guardrail: do **not** floor to 2 when one or more points has genuine
  follow-through; this targets the “model says vague but scores 3” failure mode.
