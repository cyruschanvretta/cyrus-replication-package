id: h-td-threshold-for-6-thoughtful-progression
description: >-
  Distinguishes code 50 from code 60 using the rubric’s “thoughtfully chosen” and “thoughtful
  progression” language. Must align with h-td-boundary-5-vs-6: ordinal scaffolding (Firstly /
  Secondly) does not block 60 when sections contain substantive causal or domain-specific
  development.
grounded_in: >-
  OSSLT TD rubric; cohort n=20 seed=47: under-calls at 6 (428613492, 437118961, 160800944) often
  co-occur with over-weighting “mechanical” structure. Prior draft of this rule over-capped at 5 and
  hurt agreement.
consumes:
  - td-overall-synthesis-strength
  - td-structural-completeness
  - td-technical-specificity-index
decision: >-
  TD — 5 vs 6:

  **Prefer 6 (code 60)** when ALL of the following hold: - Supporting details are not only specific
  but **strategically chosen** for the argument (e.g. authoritative
    institutions, technical/clinical terms, or precise mechanisms that advance the thesis — not interchangeable examples).
  - There is **visible progression**: later paragraphs or the conclusion build on earlier claims
  (adds nuance,
    consequence, or synthesis), not a flat list of parallel facts.
  - **Firstly / Secondly / Finally** (or similar) are **scaffolding only**. If each section unpacks
  causes,
    consequences, or domain reasoning, do **not** treat ordinals as “mechanical organization” that caps the score at 5.

  **Stay at 5** when specificity is high but examples feel interchangeable, the essay is a parade of
  isolated facts without integrative progression, or the conclusion only restates without deepening.

  **Do not** use “predictable paragraph shape” alone to withhold 6 when the content meets (a)
  thoughtful selection and (b) coherent progression as above.
boundary: 5 vs 6
risk: >-
  May occasionally award 6 to structurally plain but substantively rich responses — consistent with
  the rubric.
