id: h-td-int003-ceiling-lift-6
description: |
  Fixes 5-6 boundary.
grounded_in: |
  Intervention 003.
consumes:
  - td-elaboration-quality
  - td-structural-completeness
  - td-overall-synthesis-strength
decision: |
  TD: boundary 5↔6 ONLY.

  PREREQUISITE: ALL body paragraphs must be substantively developed
  (2+ sentences of reasoning each). If ANY paragraph is thin or
  relies on listing → cap at 5.

  Score 6 via EITHER pathway:
  A) Data-driven: numbers/statistics/percentages cited in 2+
     paragraphs AND causal mechanisms (how X → Y → Z) AND
     multi-domain coverage.
  B) Domain depth: specialized knowledge (health, environment,
     policy, infrastructure) with a progression from general
     claim → specific evidence → implications across the essay.

  If prerequisite met AND Pathway A or B met → MUST score 6.

  NOTHING ELSE CAN BLOCK BAND 6 when pathways are met:
  - "Predictable" or "mechanical" structure → irrelevant.
  - "Lacks nuance" or "lacks trade-offs" → irrelevant.
  - "Standard list-based structure" → irrelevant.
  - Ordinal markers (Firstly, Secondly) → scaffolding, not flaws.
  Do NOT invent additional criteria beyond the pathways above.

  If prerequisite not met OR neither pathway fully met → stay at 5.
sme_traceability:
  rubric:
    high_level: >-
      Anchored to the Topic Development (WR-EXT / OSSLT) scale—opinion, specificity of support, and
      organization.
    references: >-
      data-container/prod/extracted/item-type-rubrics/generated/derived-text/rubric-b29afc2906ecf0b9.md

      Platform verbatim descriptors for codes 10–60.
    link: direct
    rubric_excerpts:
      - code: "50"
        text: >-
          The essay is related to the prompt. A clear and consistent opinion is developed with
          sufficient

          specific supporting details. The content organization is logical.
        highlights: []
      - code: "60"
        text: >-
          The essay is related to the assigned prompt. A clear and consistent opinion is developed
          with

          sufficient specific supporting details that are thoughtfully chosen. The content
          organization is

          coherent and demonstrates a thoughtful progression of ideas.
        highlights:
          - progression
