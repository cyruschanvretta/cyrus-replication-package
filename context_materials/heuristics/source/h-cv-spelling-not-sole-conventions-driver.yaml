id: h-cv-spelling-not-sole-conventions-driver
description: >
  When scoring **CV** only: **weigh misspelled words as only one component of the conventions mark** (training p.8).
  Do not let spelling dominate the decision when sentence control, punctuation, and usage are otherwise solid and
  meaning is clear.
grounded_in: |
  EQAO CV training p.8 spelling weighting bullet; p.5 lists multiple convention dimensions (not spelling alone).
consumes:
  - cv-error-band
  - cv-error-density-systemic
  - cv-meaning-flow
  - cv-sentence-variety
decision: |
  CV: If spelling is the **only** weak pillar but `cv-sentence-variety` and mechanics signals show sustained control,
  **do not** pull the score down to Limited solely for spelling unless spelling **distracts** reading or pairs with
  other convention failures.

  Use `cv-error-density-systemic` to separate **local spelling slips** from **broad control collapse** across
  dimensions.

  This rule **pairs with** `h-cv-spelling-same-word-count-once`: spelling issues must not double-count as syntax and as
  multiple spelling hits without reading impact.
boundary: 2 vs 3 and 3 vs 4
risk: Could over-score responses with many distinct spelling errors that cumulatively distract readers.
