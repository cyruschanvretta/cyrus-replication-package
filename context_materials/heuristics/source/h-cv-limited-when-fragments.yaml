id: h-cv-limited-when-fragments
description: >
  When scoring **CV** only: frequent fragments, run-ons, or broken sentences that force re-reading →
  **limited (2)** or **adequate (3)** at best, not thorough — even if ideas are interesting.
grounded_in: |
  Separates idea strength (TD) from sentence control (CV).
consumes:
  - cv-sentence-variety
  - cv-meaning-flow
decision: >
  CV: If sentence_variety is “frequently broken” OR meaning_flow has “occasional friction”
  throughout,

  do not award 4. Reserve 4 for sustained control.
