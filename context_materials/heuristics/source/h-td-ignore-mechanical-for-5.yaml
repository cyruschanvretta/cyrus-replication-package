id: h-td-ignore-mechanical-for-5
description: >-
  Corrects the pattern where the model caps scores at 4 because the organization is 'mechanical'
  (First, Second, Thirdly) even when the content is 'specific' and 'logical' (Band 5). The model
  currently over-penalizes ordinal markers.
grounded_in: >-
  Grounded in taqr_ids: 170184440, 428605804

  430126903: Model correctly identified 2, but 170184440: Model failed to move from 4 to 5 despite
  specific cost/discomfort details.,428605804: Model failed to move from 4 to 5 despite causal links
  in the 'responsibility' axis.
consumes:
  - td-detail-unpack-depth
  - td-analytic-link-present
decision: >-
  When evaluating the transition from Band 4 to Band 5, you must ignore the presence of mechanical
  transitions (e.g., 'First', 'In addition', 'Secondly'). The distinction between 4 and 5 is NOT the
  sophistication of the organization, but the consistency of specificity.


  Perform this test: Check every distinct axis in the response. If the student provides specific,
  concrete details (e.g., named entities, specific consequences, or quantifiable data) for ALL major
  points, and the organization is 'logical' (even if mechanical), assign a 5. 


  Example of 5: 'First, the cost of renting soccer pitches is high. Second, wearing layers in the
  cold is uncomfortable.' (Specific details + mechanical structure = 5).

  Example of 4: 'First, sports are good. Second, weather is important.' (Generic details +
  mechanical structure = 4).


  Guardrail: Do not assign a 5 if the 'specificity' is only present in one axis and the others are
  merely 'vague' or 'insufficient'.
boundary: 4 vs 5
risk: >-
  Could lead to over-scoring 4s into 5s if the student provides specific nouns without any
  causal/logical connection.
