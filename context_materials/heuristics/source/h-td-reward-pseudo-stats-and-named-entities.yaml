id: h-td-reward-pseudo-stats-and-named-entities
description: >-
  Treat quantifiable data, causal mechanisms, and domain-specific terms as evidence of specificity
  for band 5/6.
grounded_in: "Grounded in taqr_ids: 254682169, 160967597, 280184541"
consumes: []
decision: >-
  Specific quantities (500mL, 40%, "10 years"), causal mechanisms (savings → purchase → benefit),
  and domain terms (eczema, arthritis) are indicators of specificity supporting 5/6. Named entities
  alone require development per the FACT-DROP GUARD in ceiling-lift-5.
