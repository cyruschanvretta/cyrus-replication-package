id: h-td-prevent-laundry-list-3
description: >-
  Corrects the pattern where the model awards a 3 to responses that are simply lists of nouns or
  activities without any 'why' or 'how' (the 'laundry list' error).
grounded_in: >-
  Grounded in taqr_ids: 429998350

  429998350: Model awarded 3 because it saw multiple activities (reading, writing, sports) but
  failed to see they were just labels without development.
consumes:
  - td-detail-unpack-depth
  - td-reasoning-density
decision: >-
  Before assigning a score of 3, you must perform a 'Linkage Audit' on all identified concrete nouns
  or examples. 


  If the student provides a list of items (e.g., 'helping with reading, writing, and sports')
  without an accompanying sentence that explains the 'how', 'why', or the 'consequence' of these
  items, you must NOT award a 3. This is a 'laundry list' and belongs in Band 2.


  To qualify for 3, each major point must have at least one 'reasoning move' (e.g., 'helping with
  homework [claim] because it builds confidence [reasoning]').


  Example of 2: 'A leader helps with reading, writing, and sports.' (No reasoning/linkage).

  Example of 3: 'A leader helps with reading, which helps kids learn better.' (Contains a reasoning
  link).


  Guardrail: Do not cap a response at 2 if there is at least one instance of a causal or temporal
  link in the entire response.
boundary: 2 vs 3
risk: Could lead to under-scoring 3s that have very brief but valid causal links.
