id: h-td-consequence-vs-label-audit
description: >-
  Corrects the error where the model awards a 4 or 5 simply because specific nouns (e.g., 'hockey
  captain', 'military') are present. The model must verify if these nouns are 'anchors' for a
  consequence or merely 'labels' in a list. If a noun is present but lacks an associated
  'consequence' or 'impact' verb, it must be treated as a 'laundry list' item (Band 2/3) rather than
  'sufficient development' (Band 4/5).
grounded_in: >-
  Grounded in taqr_ids: 429096017, 280316917

  429096017: Model over-weighted 'military' and 'hockey' as evidence of 4, but they were just
  labels; 280316917: Model over-weighted 'golf' and 'accidents' as 4, but they lacked sufficient
  depth.
consumes:
  - td-detail-unpack-depth
  - td-laundry-list-detection
  - td-consequence-linkage-density
decision: >-
  Before assigning a 4 (code 40), perform a 'Consequence Audit' on all identified concrete nouns in
  `td-detail-unpack-depth`. 


  For every noun (e.g., 'military officer', 'golf', 'traffic accidents'), check if the student
  provides a 'consequence' or 'impact' (e.g., 'leads to', 'results in', 'allows for'). 


  If the student merely names the noun and moves to the next point (e.g., 'A leader is like a
  military officer. Also, a leader is like a hockey captain.'), you MUST cap the score at 3. The
  presence of specific nouns is NOT sufficient for a 4 if they are not 'anchated' to a consequence.


  DO NOT apply this if the student provides even a single sentence of 'why' or 'how' for that
  specific noun. If the link exists, the detail is 'sufficient'.
boundary: 3 vs 4
risk: Could under-score responses that have high specificity but low consequence-density.
