id: h-td-consequence-anchor-check
description: >-
  Corrects the under-scoring of Band 5/6 responses. The model currently ignores 'consequence-based'
  reasoning (e.g., 'X leads to Y') as being 'sufficiently specific'. In Band 5/6, the presence of a
  causal link (analytic glue) attached to a specific noun is the primary indicator of 'thoughtful'
  or 'specific' development.
grounded_in: >-
  Grounded in taqr_ids: 437118961, 428613492, 160800944, 160967597

  taqr 437118961: Model ignored that 'confidence allows... decisions' is a specific consequence;
  taqr 160800944: Model ignored 'economic savings' as a developed axis.
consumes:
  - td-consequence-density
  - td-analytic-link-present
  - td-detail-unpack-depth
decision: >-
  Before assigning a 4, perform a 'Consequence Audit'. 


  Look at every identified concrete noun or example in the 'td-detail-unpack-depth' feature. For
  each noun, check if it is paired with a 'td-consequence-density' signal (e.g., 'leads to',
  'results in', 'causes', 'allows for', 'impacts'). 


  If the student provides a specific noun (e.g., 'Vitamin D', 'taxes', 'police') AND connects it to
  a consequence (e.g., 'improves health', 'saves money', 'increases safety'), you MUST consider this
  'specific' and 'thoughtful'. 


  If these 'consequence-linked nouns' appear in at least two distinct axes, the response is eligible
  for Band 5. If the progression of these consequences shows a logical chain (e.g., 'A causes B,
  which leads to C'), the response is eligible for Band 6. 


  Do NOT award 5 or 6 if the 'consequence' is merely a restatement of the claim (e.g., 'Being a
  leader is good because it is a good quality').
boundary: 4 vs 5/6
risk: Could over-score very thin responses if they use a single 'because' keyword.
