id: h-informational-multi-point-thorough
description: >
  Informational or persuasive responses that develop three or more distinct axes of an argument with
  at least thin elaboration each should not be capped at 2 solely for “generic” language if the
  prompt invites comparison or multi-criteria judgment.
grounded_in: >
  Operational run: frequent AI2 vs expert4 on city/town and similar prompts where students list
  several reasons (transit, jobs, health) with brief support.
consumes:
  - td-multi-axis-argument
  - td-elaboration-per-move
  - td-claim-recurrence-vs-progression
decision: |
  If distinct_axes >= 3 AND at least two axes have thin-or-better elaboration,
  floor the holistic TD score at 3 unless the response is incoherent or off-prompt.
  Consider 4 when elaboration is sustained on multiple axes OR synthesis appears across axes.
sme_traceability:
  rubric:
    high_level: >-
      Anchored to the Topic Development (WR-EXT / OSSLT) scale—opinion, specificity of support, and
      organization.
    references: >-
      data-container/prod/extracted/item-type-rubrics/generated/derived-text/rubric-b29afc2906ecf0b9.md

      Platform verbatim descriptors for codes 10–60.
    link: direct
    rubric_excerpts:
      - code: "30"
        text: >-
          The essay is related to the prompt and expresses a clear opinion. There are insufficient
          and/or

          vague supporting details or the connection of the details to the opinion is not always
          clear. There is

          evidence of content organization, but lapses distract from the overall communication
        highlights: []
      - code: "40"
        text: >-
          The essay is related to the prompt. A clear and consistent opinion is developed with
          sufficient

          supporting details; however, only some are specific. The content organization is
          mechanical, and

          any lapses do not distract from the overall communication.
        highlights: []
