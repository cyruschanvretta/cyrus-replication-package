      Additional windows (same item type):
      data-container/prod/extracted/training-materials/guides/wi-1138-sp7-OR.md,
      data-container/prod/extracted/training-materials/guides/wi-1139-sp7-OR.md,
      data-container/prod/extracted/training-materials/guides/wi-1140-sp7-OR.md, …
    link: indirect
  exemplar_selection:
