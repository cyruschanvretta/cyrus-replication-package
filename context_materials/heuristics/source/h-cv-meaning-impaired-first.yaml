id: h-cv-meaning-impaired-first
description: >
  When scoring **Conventions (CV)** only: judge whether errors **impede meaning** before counting
  errors. Local typos with clear intent ≠ band 1.
grounded_in: |
  Official CV descriptors: thorough vs insufficient turns on clarity, not idea quality.
consumes:
  - cv-meaning-flow
  - cv-error-band
decision: |
  CV: If meaning_flow is “clear throughout,” do not assign 1–2 solely for scattered typos.
  If meaning_flow is “often hard to follow,” cap at 2–3 even if some sentences are long.
