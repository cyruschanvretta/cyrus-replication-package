id: h-td-linkage-audit-strict
description: >-
  Corrects the error where the model assigns Band 2 or 3 to 'laundry lists' that use causal verbs.
  The model must verify that the 'consequence' is not just a restatement of the 'claim'. If the
  student says 'X is good because it is good' or 'Heat is bad because it causes heat', this is NOT
  analytic glue; it is a tautology and should be capped at Band 2.
grounded_in: >-
  Grounded in taqr_ids: 430254766, 443269976, 429153115

  430254766: Model saw nouns and gave 2, but expert gave 1 because no linkage existed; 443269976:
  Model saw 'linkage' and gave 3, but expert gave 2 because the link was vague/tautological.
consumes:
  - td-consequence-linkage-density
  - td-noun-expansion-ratio
decision: >-
  Before assigning a score of 3 or higher, perform a 'Tautology Check' on all identified
  'consequence' links. 


  Examine every instance where a student uses a causal verb (e_e., 'leads to', 'causes', 'results
  in'). Ask: Does the consequence provide NEW information, or does it merely restate the initial
  claim using different words? 


  Example of TAUTOLOGY (Score 2): 'A leader must be kind because being kind is a good trait.' or
  'Heat is bad because it causes heat-related issues.' 

  Example of VALID LINKAGE (Score 3/4): 'Heat is bad because it leads to increased electricity costs
  for air conditioning.' 


  If the 'consequence' is purely circular or provides no substantive 'how' or 'why', you MUST cap
  the score at 2, regardless of how many nouns are listed.
boundary: 2 vs 3
risk: Could under-score valid but simple causal links (e.g., 'Snow makes roads slippery').
