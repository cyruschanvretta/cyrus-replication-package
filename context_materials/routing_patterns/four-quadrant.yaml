schema_version: 1
selection_key: [language, skill]
forbidden_routing_inputs: [item_id, expert_score, response_set, demographic, topic_similarity]
hard_gates:
  blank_or_non_linguistic: 0
  cv_under_30_authored_words: 1
routes:
  english-td:
    evidence: deterministic
    model_call: never
    learner: random_forest_depth4
    score_scale: [0, 1, 2, 3, 4, 5, 6]
  english-cv:
    evidence: combined
    model_call: one_accepted_compact_profile
    recommended_model: gemma-3-12b-it
    learner: tree_ordinal_median
    score_scale: [0, 1, 2, 3, 4]
  french-td:
    evidence: combined
    model_call: one_accepted_compact_profile
    recommended_model: gemma-3-12b-it
    learner: tree_ordinal_expected
    score_scale: [0, 1, 2, 3, 4, 5, 6]
    validation: required_for_gemma_substitution
  french-cv:
    evidence: deterministic
    model_call: never
    learner: cumulative_ordinal_median_c003
    score_scale: [0, 1, 2, 3, 4]
range_projection:
  TD: {low_max: 2, medium_max: 4, score_min: 0, score_max: 6}
  CV: {low_max: 1, medium_max: 3, score_min: 0, score_max: 4}
